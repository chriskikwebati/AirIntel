name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and security scan
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Static security analysis (Bandit)
        run: bandit -q -r app migrations scripts
      - name: Known vulnerabilities in dependencies (pip-audit)
        run: pip-audit -r requirements.txt

  frontend:
    name: Web app lint, tests and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Known vulnerabilities in dependencies (npm audit)
        run: npm audit --audit-level=high

  docker:
    name: Docker image against Postgres
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: airintel
          POSTGRES_PASSWORD: airintel
          POSTGRES_DB: airintel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airintel -d airintel"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t airintel-backend backend
      - name: Start container
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://airintel:airintel@localhost:5432/airintel \
            -e ALERT_CRON_SECRET=ci-secret \
            airintel-backend
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz && exit 0
            sleep 1
          done
          exit 1
      - name: Smoke test the API on Postgres
        run: |
          set -e
          B=http://localhost:8000
          # Migrations ran on startup, so registering a device and reading stats must work.
          curl -sf -X POST $B/api/alerts/register -H 'Content-Type: application/json' \
            -d '{"push_token":"ExponentPushToken[ci]","lat":38.9,"lon":-77.0}'
          stats=$(curl -sf -H 'X-Alert-Secret: ci-secret' "$B/internal/stats?days=7")
          echo "$stats"
          echo "$stats" | jq -e '.registered_devices == 1' > /dev/null
          # Security checks against the real container.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $B/internal/alerts/check -H 'X-Alert-Secret: wrong')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "$B/api/aqi-risk?lat=999&lon=0")" = 422
          test "$(docker exec api whoami)" = airintel
      - name: Container logs
        if: always()
        run: docker logs api
