services:
  - type: web
    name: airintel-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AIRNOW_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
